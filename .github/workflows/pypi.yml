name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build release distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: [self-hosted, linux, X64]
    needs: release-build
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Publish release distributions to devpi
        run: |
          uvx --from devpi-client devpi use http://devpi:3141/root/local
          uvx --from devpi-client devpi login root --password "$DEVPI_PASSWORD"
          uvx --from devpi-client devpi upload --no-vcs dist/*
        env:
          DEVPI_PASSWORD: ${{ secrets.DEVPI_PASSWORD }}

